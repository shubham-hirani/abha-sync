version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: uvicorn main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
  env:
    - name: DB_HOST
      value: "your-rds-endpoint.aws.com"
    - name: DB_NAME
      value: "mydb"
    - name: DB_USER
      value: "postgres"
services:
  # ─────────────────────────────────────
  # PostgreSQL — app data (NOT Supabase auth)
  # ─────────────────────────────────────
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abhasync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abhasync_pass}
      POSTGRES_DB: ${POSTGRES_DB:-abhasync_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-abhasync}:${POSTGRES_PASSWORD:-abhasync_pass}@postgres:5432/${POSTGRES_DB:-abhasync_db}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app # hot-reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    dns:
      - 1.1.1.1
      - 1.0.0.1
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1

  # ─────────────────────────────────────
  # React Frontend (dev mode with Vite)
  # ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
